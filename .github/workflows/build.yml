
name: Build JBN Grab (Linux i386)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -q JBN_GRAB_GITHUB_BUILD.zip
          test -d JBN_GRAB_GITHUB_BUILD/bundle
          test -f JBN_GRAB_GITHUB_BUILD/amxmodx-compiler/amxxpc32.so

      - name: Install 32-bit build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib cmake file binutils \
            libc6-i386 lib32gcc-s1 lib32stdc++6

      - name: Compile Metamod native module (i386)
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/JBN_GRAB_GITHUB_BUILD"
          cd "$PROJECT/bundle/native/jbn_bsp_native"

          chmod +x build_metamod_linux.sh
          ./build_metamod_linux.sh

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build-mm/jbn_bsp_native.so "$GITHUB_WORKSPACE/dist/"

          file "$GITHUB_WORKSPACE/dist/jbn_bsp_native.so"
          readelf -h "$GITHUB_WORKSPACE/dist/jbn_bsp_native.so" | grep -E 'Class:|Machine:'

      - name: Compile AMXX plugin
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/JBN_GRAB_GITHUB_BUILD"
          COMPILER="$PROJECT/amxmodx-compiler"

          cd "$COMPILER"

          chmod +x amxxpc
          chmod +x amxxpc32.so

          export LD_LIBRARY_PATH="$COMPILER:${LD_LIBRARY_PATH:-}"

          mkdir -p "$GITHUB_WORKSPACE/dist"

          ./amxxpc \
            "$PROJECT/bundle/addons/amxmodx/scripting/jbn_grab.sma" \
            -i"$PROJECT/bundle/addons/amxmodx/scripting/include" \
            -i"$COMPILER/include" \
            -o"$GITHUB_WORKSPACE/dist/jbn_grab.amxx"

          test -s "$GITHUB_WORKSPACE/dist/jbn_grab.amxx"

          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Include installation files and checksums
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/JBN_GRAB_GITHUB_BUILD"

          cp "$PROJECT/bundle/addons/amxmodx/configs/jbn_grab.ini" dist/

          if [ -f "$PROJECT/bundle/INSTALL_RU.txt" ]; then
            cp "$PROJECT/bundle/INSTALL_RU.txt" dist/
          fi

          (cd dist && sha256sum * > SHA256SUMS.txt)

          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JBN-GRAB-LINUX-I386
          path: dist/
          if-no-files-found: error
