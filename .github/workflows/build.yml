name: Build JBN Grab (Linux i386)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib cmake file binutils \
            libc6-i386 lib32gcc-s1 lib32stdc++6

      - name: Download official AMX Mod X 1.10 compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amxx"
          curl -fL --retry 3 \
            "https://www.amxmodx.org/amxxdrop/1.10/amxmodx-1.10.0-git5488-base-linux.tar.gz" \
            -o "$RUNNER_TEMP/amxx-base.tar.gz"
          tar -xzf "$RUNNER_TEMP/amxx-base.tar.gz" -C "$RUNNER_TEMP/amxx"

          COMPILER="$RUNNER_TEMP/amxx/addons/amxmodx/scripting"
          test -x "$COMPILER/amxxpc" || chmod +x "$COMPILER/amxxpc"
          test -s "$COMPILER/amxxpc"
          test -s "$COMPILER/amxxpc32.so"
          test -f "$COMPILER/include/amxmodx.inc"
          echo "AMXX_COMPILER=$COMPILER" >> "$GITHUB_ENV"
          file "$COMPILER/amxxpc"
          strings "$COMPILER/amxxpc" | grep -m1 '1\.10\.0' || true

      - name: Compile Metamod native module (i386)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bundle/native/jbn_bsp_native/build_metamod_linux.sh
          bundle/native/jbn_bsp_native/build_metamod_linux.sh
          mkdir -p dist
          cp bundle/native/jbn_bsp_native/build-mm/jbn_bsp_native.so dist/
          file dist/jbn_bsp_native.so
          readelf -h dist/jbn_bsp_native.so | grep -E 'Class:|Machine:'

      - name: Compile AMXX plugin with official compiler
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/bundle/addons/amxmodx/scripting/jbn_grab.sma"
          CUSTOM_INCLUDE="$GITHUB_WORKSPACE/bundle/addons/amxmodx/scripting/include"
          OUTPUT="$GITHUB_WORKSPACE/dist/jbn_grab.amxx"

          test -s "$SOURCE"
          test -s "$CUSTOM_INCLUDE/jbe_core.inc"
          test -x "$AMXX_COMPILER/amxxpc"

          # Place the project's custom include beside the official AMXX includes.
          cp "$CUSTOM_INCLUDE/jbe_core.inc" "$AMXX_COMPILER/include/jbe_core.inc"

          # AMXX's Linux compiler loads amxxpc32.so from its own directory.
          cd "$AMXX_COMPILER"
          export LD_LIBRARY_PATH="$AMXX_COMPILER${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          echo "Compiler:"
          file ./amxxpc ./amxxpc32.so
          ldd ./amxxpc || true

          ./amxxpc "$SOURCE" \
            -i"$AMXX_COMPILER/include" \
            -o"$OUTPUT"

          test -s "$OUTPUT"
          file "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Add plugin configuration and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp bundle/addons/amxmodx/configs/jbn_grab.ini dist/
          if [[ -f bundle/INSTALL_RU.txt ]]; then
            cp bundle/INSTALL_RU.txt dist/
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JBN-GRAB-LINUX-I386
          path: dist/
          if-no-files-found: error
