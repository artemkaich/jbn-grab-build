
name: Build JBN Grab

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            libstdc++6:i386 \
            zlib1g:i386 \
            unzip

      - name: Extract project
        run: |
          mkdir -p JBN_GRAB_GITHUB_BUILD
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d JBN_GRAB_GITHUB_BUILD

      - name: Set project paths
        run: |
          echo "PROJECT=$GITHUB_WORKSPACE/JBN_GRAB_GITHUB_BUILD" >> "$GITHUB_ENV"
          echo "COMPILER=$GITHUB_WORKSPACE/JBN_GRAB_GITHUB_BUILD/amxmodx-compiler" >> "$GITHUB_ENV"

      - name: Build Metamod plugin
        run: |
          cd "$PROJECT/bundle/native/jbn_bsp_native"
          chmod +x build_metamod_linux.sh
          ./build_metamod_linux.sh

      - name: Check native plugin
        run: |
          find "$PROJECT" -name 'jbn_bsp_native.so' -type f
          test -f "$PROJECT/bundle/native/jbn_bsp_native/build-mm/jbn_bsp_native.so"
          file "$PROJECT/bundle/native/jbn_bsp_native/build-mm/jbn_bsp_native.so"

      - name: Compile AMXX plugin
        run: |
          cd "$COMPILER"
          chmod +x amxxpc
          export LD_LIBRARY_PATH="$COMPILER:$LD_LIBRARY_PATH"

          SOURCE="$PROJECT/bundle/addons/amxmodx/scripting/jbn_grab.sma"
          test -f "$SOURCE"
          test -f "$COMPILER/amxxpc"

          ./amxxpc "$SOURCE" \
            -i"$PROJECT/bundle/addons/amxmodx/scripting/include" \
            -i"$COMPILER/include" \
            -o"$GITHUB_WORKSPACE/jbn_grab.amxx"

      - name: Verify AMXX plugin
        run: |
          test -s "$GITHUB_WORKSPACE/jbn_grab.amxx"
          file "$GITHUB_WORKSPACE/jbn_grab.amxx"

      - name: Prepare release package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$PROJECT/bundle/native/jbn_bsp_native/build-mm/jbn_bsp_native.so" \
            "$GITHUB_WORKSPACE/dist/"
          cp "$GITHUB_WORKSPACE/jbn_grab.amxx" \
            "$GITHUB_WORKSPACE/dist/"

      - name: Upload compiled plugins
        uses: actions/upload-artifact@v4
        with:
          name: jbn-grab-linux
          path: dist/
