          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname 'JBN_GRAB_GITHUB_BUILD.zip' -print -quit)"
          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: JBN_GRAB_GITHUB_BUILD.zip was not found in the repository."
            echo "Files in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/jbn-grab-project"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          CMAKE_FILE="$(find "$EXTRACT_DIR" -type f -path '*/bundle/native/jbn_bsp_native/CMakeLists.txt' -print -quit)"
          if [[ -z "$CMAKE_FILE" ]]; then
            echo "ERROR: Could not find bundle/native/jbn_bsp_native/CMakeLists.txt inside ZIP."
            find "$EXTRACT_DIR" -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          PROJECT="$(dirname "$(dirname "$(dirname "$CMAKE_FILE")")")"
          SOURCE="$PROJECT/bundle/addons/amxmodx/scripting/jbn_grab.sma"
          INCLUDE="$PROJECT/bundle/addons/amxmodx/scripting/include"
          NATIVE="$PROJECT/bundle/native/jbn_bsp_native"

          test -f "$SOURCE"
          test -f "$INCLUDE/jbe_core.inc"
          test -f "$NATIVE/build_metamod_linux.sh"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"
          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
          echo "Detected project root: $PROJECT"

      - name: Download official AMX Mod X 1.10 compiler
        shell: bash
        run: |
          set -euo pipefail
          AMXX_ARCHIVE="$RUNNER_TEMP/amxmodx-base.tar.gz"
          AMXX_URL="https://www.amxmodx.org/amxxdrop/1.10/amxmodx-1.10.0-git5488-base-linux.tar.gz"
          curl -fL --retry 3 "$AMXX_URL" -o "$AMXX_ARCHIVE"
          mkdir -p "$RUNNER_TEMP/amxx"
          tar -xzf "$AMXX_ARCHIVE" -C "$RUNNER_TEMP/amxx"
          AMXX_SCRIPTING="$RUNNER_TEMP/amxx/addons/amxmodx/scripting"
          test -x "$AMXX_SCRIPTING/amxxpc"
          chmod +x "$AMXX_SCRIPTING/amxxpc"
          echo "AMXX_SCRIPTING=$AMXX_SCRIPTING" >> "$GITHUB_ENV"
          file "$AMXX_SCRIPTING/amxxpc"
          "$AMXX_SCRIPTING/amxxpc" 2>&1 | head -20 || true

      - name: Build Metamod native module (Linux i386)
        shell: bash
        run: |
          set -euo pipefail
          NATIVE="${{ steps.project.outputs.native }}"
          cd "$NATIVE"
          chmod +x build_metamod_linux.sh
          ./build_metamod_linux.sh

          SO_FILE="$(find "$NATIVE" -type f -name '*.so' -print -quit)"
          if [[ -z "$SO_FILE" ]]; then
            echo "ERROR: Native build completed but no .so file was found."
            find "$NATIVE" -maxdepth 5 -type f | sort
            exit 1
          fi
          file "$SO_FILE"
          file "$SO_FILE" | grep -q 'ELF 32-bit'
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$SO_FILE" "$GITHUB_WORKSPACE/dist/jbn_bsp_native.so"

      - name: Compile AMXX plugin with official compiler
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="${{ steps.project.outputs.source }}"
          INCLUDE="${{ steps.project.outputs.include }}"
          OUTPUT="$GITHUB_WORKSPACE/dist/jbn_grab.amxx"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$INCLUDE/jbe_core.inc" "$AMXX_SCRIPTING/include/jbe_core.inc"
          chmod +x "$AMXX_SCRIPTING/amxxpc"
          cd "$AMXX_SCRIPTING"
          ./amxxpc "$SOURCE" \
            -i"$INCLUDE" \
            -i"$AMXX_SCRIPTING/include" \
            -o"$OUTPUT"
          test -s "$OUTPUT"
          file "$OUTPUT"

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jbn-grab-linux
          path: dist/
          if-no-files-found: error
