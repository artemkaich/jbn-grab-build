
name: Build JBN Grab Metamod (Linux i386)

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux i386 dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            curl \
            unzip \
            file \
            gcc-multilib \
            g++-multilib \
            libc6-i386 \
            lib32gcc-s1 \
            lib32stdc++6

      - name: Extract project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -type f \
            -iname 'JBN_GRAB_GITHUB_BUILD.zip' \
            -print -quit)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/jbn-grab-project"

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          CMAKE_FILE="$(find "$EXTRACT_DIR" \
            -type f \
            -path '*/bundle/native/jbn_bsp_native/CMakeLists.txt' \
            -print -quit)"

          if [[ -z "$CMAKE_FILE" ]]; then
            echo "ERROR: Native CMakeLists.txt not found!"
            find "$EXTRACT_DIR" -type f | sort
            exit 1
          fi

          PROJECT="$(cd "$(dirname "$CMAKE_FILE")/../../.." && pwd)"

          NATIVE="$PROJECT/bundle/native/jbn_bsp_native"

          test -f "$NATIVE/CMakeLists.txt"
          test -f "$NATIVE/build_metamod_linux.sh"

          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"

          echo "Project: $PROJECT"
          echo "Native source: $NATIVE"

      - name: Build Metamod plugin Linux i386
        shell: bash
        run: |
          set -euo pipefail

          NATIVE="${{ steps.project.outputs.native }}"

          cd "$NATIVE"

          chmod +x build_metamod_linux.sh

          echo "=================================="
          echo "Building JBN Grab Metamod plugin"
          echo "Target: Linux i386"
          echo "=================================="

          ./build_metamod_linux.sh

          echo "Searching for compiled shared library..."

          SO_FILE="$(find "$NATIVE" \
            -type f \
            -name '*.so' \
            -print -quit)"

          if [[ -z "$SO_FILE" ]]; then
            echo "ERROR: No .so file was generated!"
            find "$NATIVE" -maxdepth 7 -type f | sort
            exit 1
          fi

          echo "Compiled library: $SO_FILE"

          file "$SO_FILE"

          if ! file "$SO_FILE" | grep -q 'ELF 32-bit'; then
            echo "ERROR: Expected Linux 32-bit ELF library!"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$SO_FILE" \
            "$GITHUB_WORKSPACE/dist/jbn_bsp_native.so"

          echo "=================================="
          echo "BUILD SUCCESSFUL"
          echo "=================================="

          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Upload Metamod artifact
        uses: actions/upload-artifact@v4
        with:
          name: jbn-grab-metamod-linux-i386
          path: dist/jbn_bsp_native.so
          if-no-files-found: error
