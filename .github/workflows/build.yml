
name: JBN Grab Diagnostic Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            unzip curl file python3 \
            build-essential cmake git \
            gcc-multilib g++-multilib \
            libc6-i386 lib32gcc-s1 lib32stdc++6

      - name: Extract project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -name 'JBN_GRAB_GITHUB_BUILD.zip' -print -quit)
          test -n "$ZIP"

          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/project"

          CMAKE=$(find "$RUNNER_TEMP/project" \
            -path '*/bundle/native/jbn_bsp_native/CMakeLists.txt' \
            -print -quit)

          test -n "$CMAKE"

          PROJECT=$(cd "$(dirname "$CMAKE")/../../.." && pwd)

          SOURCE="$PROJECT/bundle/addons/amxmodx/scripting/jbn_grab.sma"
          INCLUDE="$PROJECT/bundle/addons/amxmodx/scripting/include"

          test -f "$SOURCE"
          test -f "$INCLUDE/jbe_core.inc"

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"

          echo "Project: $PROJECT"
          wc -lc "$SOURCE"

      - name: Download AMXX 1.9.0 from GitHub
        run: |
          set -euo pipefail

          URL="https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-base-linux.tar.gz"

          curl -fL --retry 3 "$URL" \
            -o "$RUNNER_TEMP/amxx.tar.gz"

          mkdir -p "$RUNNER_TEMP/amxx"

          tar -xzf "$RUNNER_TEMP/amxx.tar.gz" \
            -C "$RUNNER_TEMP/amxx"

          AMXX="$RUNNER_TEMP/amxx/addons/amxmodx/scripting"

          test -x "$AMXX/amxxpc"

          chmod +x "$AMXX/amxxpc"

          echo "AMXX_SCRIPTING=$AMXX" >> "$GITHUB_ENV"

          "$AMXX/amxxpc" 2>&1 | head -10 || true

      - name: Prepare includes
        run: |
          set -euo pipefail

          INCLUDE="${{ steps.project.outputs.include }}"

          cp "$INCLUDE/jbe_core.inc" \
            "$AMXX_SCRIPTING/include/jbe_core.inc"

      - name: Diagnose compiler crash
        shell: bash
        run: |
          set -uo pipefail

          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          source = Path("${{ steps.project.outputs.source }}")
          include = "${{ steps.project.outputs.include }}"

          compiler = Path(os.environ["AMXX_SCRIPTING"]) / "amxxpc"
          compiler_inc = Path(os.environ["AMXX_SCRIPTING"]) / "include"

          text = source.read_text(
              encoding="utf-8",
              errors="replace"
          )

          pattern = re.compile(
              r'^(?:(?:public|stock)\s+)?'
              r'(?:(?:Float|bool|[A-Za-z_]\w*):\s*)?'
              r'([A-Za-z_]\w*)\s*\([^;{}]*?\)\s*\{',
              re.MULTILINE
          )

          excluded = {"if", "for", "while", "switch"}

          matches = [
              m for m in pattern.finditer(text)
              if m.group(1) not in excluded
          ]

          print(f"Source lines: {len(text.splitlines())}")
          print(f"Detected function candidates: {len(matches)}")

          if not matches:
              print("Could not detect function declarations.")
              raise SystemExit(1)

          temp = Path(os.environ["RUNNER_TEMP"])
          test_file = temp / "jbn_test.sma"
          output = temp / "jbn_test.amxx"

          def compile_test(count):
              end = matches[count].start() if count < len(matches) else len(text)

              test_file.write_text(text[:end], encoding="utf-8")

              cmd = [
                  str(compiler),
                  str(test_file),
                  f"-i{include}",
                  f"-i{compiler_inc}",
                  f"-o{output}"
              ]

              try:
                  result = subprocess.run(
                      cmd,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      timeout=120
                  )

                  log = result.stdout or ""

                  crashed = (
                      result.returncode in (-6, 134, 139)
                      or "std::bad_alloc" in log
                  )

                  print(
                      f"Functions: {count}/{len(matches)} "
                      f"Exit: {result.returncode} "
                      f"Crash: {crashed}"
                  )

                  if crashed:
                      print(log[-3000:])

                  return crashed

              except subprocess.TimeoutExpired:
                  print("Compiler timeout.")
                  return False

          print("Testing global declarations...")

          if compile_test(0):
              print("CRASH: GLOBAL DECLARATIONS OR INCLUDES")
              raise SystemExit(0)

          print("Testing complete source...")

          if not compile_test(len(matches)):
              print("Full source did not reproduce bad_alloc.")
              raise SystemExit(0)

          low = 1
          high = len(matches)

          while low < high:
              middle = (low + high) // 2

              if compile_test(middle):
                  high = middle
              else:
                  low = middle + 1

          culprit = matches[low - 1]

          line = text.count("\n", 0, culprit.start()) + 1

          print("")
          print("========== RESULT ==========")
          print("First crashing source prefix:")
          print("Function:", culprit.group(1))
          print("Line:", line)
          print("============================")

          PY

      - name: Upload diagnostic information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jbn-grab-diagnostic
          path: |
            ${{ runner.temp }}/jbn_test.sma
          if-no-files-found: warn
