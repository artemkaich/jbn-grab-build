            echo "Expected exactly one ZIP in repository root; found ${#zips[@]}"
            printf '%s\n' "${zips[@]}"
            exit 1
          fi
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/jbn-extract"
          mapfile -t projects < <(find "$RUNNER_TEMP/jbn-extract" -type f -path '*/bundle/native/jbn_bsp_native/CMakeLists.txt' -print)
          if [[ ${#projects[@]} -ne 1 ]]; then
            echo "Expected one project CMakeLists.txt; found ${#projects[@]}"
            printf '%s\n' "${projects[@]}"
            exit 1
          fi
          PROJECT="${projects[0]%/bundle/native/jbn_bsp_native/CMakeLists.txt}"
          test -s "$PROJECT/bundle/addons/amxmodx/scripting/jbn_grab.sma"
          test -s "$PROJECT/bundle/addons/amxmodx/scripting/include/jbe_core.inc"
          test -d "$PROJECT/sdk/Metamod-R-master"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Detected project root: $PROJECT"

      - name: Download official AMX Mod X 1.10 compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amxx"
          curl -fL --retry 3 \
            "https://www.amxmodx.org/amxxdrop/1.10/amxmodx-1.10.0-git5488-base-linux.tar.gz" \
            -o "$RUNNER_TEMP/amxx-base.tar.gz"
          tar -xzf "$RUNNER_TEMP/amxx-base.tar.gz" -C "$RUNNER_TEMP/amxx"
          COMPILER="$RUNNER_TEMP/amxx/addons/amxmodx/scripting"
          test -s "$COMPILER/amxxpc"
          test -s "$COMPILER/amxxpc32.so"
          test -f "$COMPILER/include/amxmodx.inc"
          chmod +x "$COMPILER/amxxpc"
          echo "AMXX_COMPILER=$COMPILER" >> "$GITHUB_ENV"
          file "$COMPILER/amxxpc"
          strings "$COMPILER/amxxpc" | grep -m1 '1\.10\.0' || true

      - name: Build Metamod native plugin (i386)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT/bundle/native/jbn_bsp_native"
          chmod +x build_metamod_linux.sh
          ./build_metamod_linux.sh
          test -s build-mm/jbn_bsp_native.so
          file build-mm/jbn_bsp_native.so | grep -q 'ELF 32-bit'
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build-mm/jbn_bsp_native.so "$GITHUB_WORKSPACE/dist/jbn_bsp_native.so"
          file "$GITHUB_WORKSPACE/dist/jbn_bsp_native.so"
          readelf -h "$GITHUB_WORKSPACE/dist/jbn_bsp_native.so" | grep -E 'Class:|Machine:'

      - name: Compile AMXX plugin with official compiler
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$PROJECT/bundle/addons/amxmodx/scripting/jbn_grab.sma"
          CUSTOM_INCLUDE="$PROJECT/bundle/addons/amxmodx/scripting/include"
          OUTPUT="$GITHUB_WORKSPACE/dist/jbn_grab.amxx"
          test -s "$SOURCE"
          test -s "$CUSTOM_INCLUDE/jbe_core.inc"
          cp "$CUSTOM_INCLUDE/jbe_core.inc" "$AMXX_COMPILER/include/jbe_core.inc"
          cd "$AMXX_COMPILER"
          export LD_LIBRARY_PATH="$AMXX_COMPILER${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          file ./amxxpc ./amxxpc32.so
          ldd ./amxxpc || true
          ./amxxpc "$SOURCE" -i"$AMXX_COMPILER/include" -o"$OUTPUT"
          test -s "$OUTPUT"
          file "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Add configuration and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT/bundle/addons/amxmodx/configs/jbn_grab.ini" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT/bundle/INSTALL_RU.txt" "$GITHUB_WORKSPACE/dist/" || true
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum * > SHA256SUMS.txt)
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JBN-GRAB-LINUX-I386
          path: dist/
          if-no-files-found: error
