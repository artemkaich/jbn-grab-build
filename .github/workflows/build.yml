name: Build JBN Grab

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcc-multilib g++-multilib \
            libc6-dev-i386 libc6:i386 libstdc++6:i386 zlib1g:i386 unzip

      - name: Extract project and detect its real root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jbn-extract"
          mapfile -t zips < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one project ZIP in repository root; found ${#zips[@]}"
            printf '%s\n' "${zips[@]}"
            exit 1
          fi
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/jbn-extract"

          mapfile -t native_projects < <(find "$RUNNER_TEMP/jbn-extract" -type f -path '*/bundle/native/jbn_bsp_native/CMakeLists.txt' -print)
          if [ "${#native_projects[@]}" -ne 1 ]; then
            echo "Expected exactly one bundle/native/jbn_bsp_native/CMakeLists.txt; found ${#native_projects[@]}"
            printf '%s\n' "${native_projects[@]}"
            exit 1
          fi

          PROJECT="${native_projects[0]%/bundle/native/jbn_bsp_native/CMakeLists.txt}"
          test -f "$PROJECT/bundle/addons/amxmodx/scripting/jbn_grab.sma"
          test -d "$PROJECT/amxmodx-compiler"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Detected project root: $PROJECT"

      - name: Build Metamod native plugin
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT/bundle/native/jbn_bsp_native"
          chmod +x build_metamod_linux.sh
          ./build_metamod_linux.sh

      - name: Verify native plugin
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t native_outputs < <(find "$PROJECT/bundle/native/jbn_bsp_native" -type f -name 'jbn_bsp_native.so' -print)
          if [ "${#native_outputs[@]}" -ne 1 ]; then
            echo "Expected one jbn_bsp_native.so; found ${#native_outputs[@]}"
            printf '%s\n' "${native_outputs[@]}"
            exit 1
          fi
          file "${native_outputs[0]}"
          file "${native_outputs[0]}" | grep -q 'ELF 32-bit'
          echo "NATIVE_SO=${native_outputs[0]}" >> "$GITHUB_ENV"

      - name: Compile AMXX plugin
        shell: bash
        run: |
          set -euo pipefail
          COMPILER="$PROJECT/amxmodx-compiler"
          SOURCE="$PROJECT/bundle/addons/amxmodx/scripting/jbn_grab.sma"
          OUTPUT="$GITHUB_WORKSPACE/jbn_grab.amxx"

          test -f "$SOURCE"
          test -x "$COMPILER/amxxpc" || chmod +x "$COMPILER/amxxpc"
          test -f "$COMPILER/amxxpc32.so"
          export LD_LIBRARY_PATH="$COMPILER${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          file "$COMPILER/amxxpc"
          ldd "$COMPILER/amxxpc" || true
          "$COMPILER/amxxpc" "$SOURCE" \
            -i"$PROJECT/bundle/addons/amxmodx/scripting/include" \
            -i"$COMPILER/include" \
            -o"$OUTPUT"

          test -s "$OUTPUT"

      - name: Verify and package plugins
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/jbn_grab.amxx"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$NATIVE_SO" "$GITHUB_WORKSPACE/dist/jbn_bsp_native.so"
          cp "$GITHUB_WORKSPACE/jbn_grab.amxx" "$GITHUB_WORKSPACE/dist/jbn_grab.amxx"
          file "$GITHUB_WORKSPACE/dist/jbn_bsp_native.so"
          file "$GITHUB_WORKSPACE/dist/jbn_grab.amxx"

      - name: Upload compiled plugins
        uses: actions/upload-artifact@v4
        with:
          name: jbn-grab-linux
          path: dist/
          if-no-files-found: error
