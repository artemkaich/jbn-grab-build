
name: Build JBN Grab (Linux i386)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          set -euo pipefail
          unzip -q JBN_GRAB_GITHUB_BUILD.zip
          test -d JBN_GRAB_GITHUB_BUILD

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gcc-multilib \
            g++-multilib \
            libc6-i386 \
            lib32gcc-s1 \
            lib32stdc++6 \
            lib32z1 \
            util-linux \
            file \
            binutils

      - name: Build Metamod native module
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/JBN_GRAB_GITHUB_BUILD"
          NATIVE="$PROJECT/bundle/native/jbn_bsp_native"

          cd "$NATIVE"

          chmod +x build_metamod_linux.sh
          ./build_metamod_linux.sh

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build-mm/jbn_bsp_native.so \
            "$GITHUB_WORKSPACE/dist/jbn_bsp_native.so"

          file "$GITHUB_WORKSPACE/dist/jbn_bsp_native.so"
          readelf -h "$GITHUB_WORKSPACE/dist/jbn_bsp_native.so" | grep -E 'Class:|Machine:'

      - name: Compile AMXX plugin
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/JBN_GRAB_GITHUB_BUILD"
          COMPILER="$PROJECT/amxmodx-compiler"
          SOURCE="$PROJECT/bundle/addons/amxmodx/scripting/jbn_grab.sma"

          test -f "$SOURCE"
          test -f "$COMPILER/amxxpc"
          test -f "$COMPILER/amxxpc32.so"

          cd "$COMPILER"

          chmod +x ./amxxpc
          unset LD_PRELOAD
          unset LD_LIBRARY_PATH

          linux32 ./amxxpc \
            "$SOURCE" \
            -i"$PROJECT/bundle/addons/amxmodx/scripting/include" \
            -i"$COMPILER/include" \
            -o"$GITHUB_WORKSPACE/dist/jbn_grab.amxx"

          test -s "$GITHUB_WORKSPACE/dist/jbn_grab.amxx"

      - name: Prepare package
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/JBN_GRAB_GITHUB_BUILD"

          if [ -f "$PROJECT/bundle/addons/amxmodx/configs/jbn_grab.ini" ]; then
            cp "$PROJECT/bundle/addons/amxmodx/configs/jbn_grab.ini" \
              "$GITHUB_WORKSPACE/dist/"
          fi

          if [ -f "$PROJECT/bundle/INSTALL_RU.txt" ]; then
            cp "$PROJECT/bundle/INSTALL_RU.txt" \
              "$GITHUB_WORKSPACE/dist/"
          fi

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/* > dist/SHA256SUMS
          zip -r JBN_GRAB_LINUX_BUILD.zip dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JBN_GRAB_LINUX_BUILD
          path: |
            dist/
            JBN_GRAB_LINUX_BUILD.zip
          if-no-files-found: error
